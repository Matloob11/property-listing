upstream a7_listing_v2_app {
    server 127.0.0.1:8844;
}

server {
    listen 80;
    listen [::]:80;
    server_name listings.srv1802669.hstgr.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/a7-listing-v2-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name listings.srv1802669.hstgr.cloud;

    ssl_certificate     /etc/letsencrypt/live/listings.srv1802669.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/listings.srv1802669.hstgr.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:a7listv2:10m;

    access_log /var/log/nginx/a7-listing-v2.access.log main;
    error_log  /var/log/nginx/a7-listing-v2.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/a7-listing-v2-acme;
    }

    location /studio/ {
        proxy_pass http://a7_listing_v2_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Content-Security-Policy "frame-ancestors https://crm.a7grouprealestatedxb.com" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        proxy_pass http://a7_listing_v2_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Content-Security-Policy "frame-ancestors https://crm.a7grouprealestatedxb.com" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://a7_listing_v2_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        error_page 405 =200 $uri;

        add_header Content-Security-Policy "frame-ancestors https://crm.a7grouprealestatedxb.com" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }
}
